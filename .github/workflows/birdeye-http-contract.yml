name: BirdEye HTTP MCP contract

on:
  pull_request:
    paths:
      - "http_mcp_server.py"
      - "mcp_server.py"
      - "loop_mcp_server.py"
      - "tests/test_http_mcp_server.py"
      - ".github/workflows/birdeye-http-contract.yml"
  push:
    branches: [main]
    paths:
      - "http_mcp_server.py"
      - "mcp_server.py"
      - "loop_mcp_server.py"
      - "tests/test_http_mcp_server.py"
      - ".github/workflows/birdeye-http-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transport dependencies
        run: python -m pip install --disable-pip-version-check mcp uvicorn starlette watchdog
      - name: Compile transport owners
        run: python -m py_compile http_mcp_server.py mcp_server.py loop_mcp_server.py remote_transport.py
      - name: Verify registry and endpoint contract
        run: python -m unittest discover -s tests -p "test_http_mcp_server.py" -v
      - name: Verify Streamable HTTP app builds
        run: python -c "import http_mcp_server as h; app=h.build_app(); assert h._tool_names(); print(h.SERVER_NAME, h.DEFAULT_PORT, h.MCP_PATH, len(h._tool_names()))"
